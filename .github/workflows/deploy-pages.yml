name: Deploy web to GitHub Pages


on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: true


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9


      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile


      - name: Set baseUrl for GitHub Pages
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('app.json','utf8'));p.expo.experiments=(p.expo.experiments||{});p.expo.experiments.baseUrl='/Who-s-in-charge';fs.writeFileSync('app.json',JSON.stringify(p,null,2))"


      - name: Export web build
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://qtxppxvrxpwrnlbdheyw.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0eHBweHZyeHB3cm5sYmRoZXl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NjAxNjAsImV4cCI6MjEwNTQzNjE2MH0.DFKmkBYud0Ca-TceFYn_NO1QKXUxrZQOaJZvFPuSP8g
          EXPO_PUBLIC_APP_ID: ${{ vars.EXPO_PUBLIC_APP_ID }}
        run: npx expo export --platform web


      - name: Setup Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist


      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
